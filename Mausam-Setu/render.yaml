services:
  - type: web
    name: mausam-personal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: mausam-personal-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_FALLBACK
        value: "false"
databases:
  - name: mausam-personal-db
    databaseName: mausam
    user: mausam
